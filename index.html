<!-- index.html -->

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Call</title>

<style>
:root{
--primary:#00bcd4;
--bg:#121212;
--card:#2c2c2c;
--border:#444;
--text:#fff;
--sub:#aaa;
--green:#4caf50;
--red:#f44336;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

/* LOGIN */
#auth{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:var(--card);
padding:36px;
border-radius:24px;
border:1px solid var(--border);
}

.box h1{
text-align:center;
color:var(--primary);
margin-bottom:10px;
}

.box p{
text-align:center;
color:var(--sub);
margin-bottom:24px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1d1d1d;
color:#fff;
margin-bottom:12px;
}

button{
border:none;
padding:14px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.full{width:100%;}

.blue{
background:var(--primary);
color:#000;
}

.line{
background:none;
border:1px solid var(--primary);
color:var(--primary);
margin-top:10px;
}

/* APP */
#app{
display:none;
height:100vh;
}

.wrap{
display:grid;
grid-template-columns:320px 1fr 320px;
height:100vh;
gap:2px;
background:var(--border);
}

.panel{
background:var(--bg);
padding:16px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.title{
background:var(--card);
padding:14px;
border-radius:16px;
text-align:center;
font-weight:700;
color:var(--primary);
margin-bottom:14px;
}

.scroll{
flex:1;
overflow-y:auto;
}

.user{
display:flex;
align-items:center;
gap:10px;
background:var(--card);
padding:10px;
border-radius:14px;
margin-bottom:10px;
}

.user img{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--primary);
}

.online{
width:10px;
height:10px;
border-radius:50%;
background:var(--green);
}

.name{
flex:1;
font-weight:600;
}

.center{
background:#1a1a1a;
display:flex;
flex-direction:column;
height:100vh;
}

#profile{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
}

.big{
width:170px;
height:170px;
border-radius:50%;
overflow:hidden;
border:4px solid var(--primary);
margin-bottom:20px;
background:var(--card);
}

.big img{
width:100%;
height:100%;
object-fit:cover;
}

#call{
display:none;
height:100%;
flex-direction:column;
}

#callHead{
padding:15px;
background:var(--card);
color:var(--primary);
text-align:center;
font-weight:700;
}

#videos{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

video{
width:260px;
border-radius:16px;
background:#000;
}

.controls{
display:flex;
gap:10px;
padding:12px;
background:var(--card);
}

small{
color:var(--sub);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">

<div class="box">

<h1>SMART-CALL</h1>

<p>
Llamadas privadas y grupales
</p>

<input id="user" placeholder="Usuario">

<input
id="pass"
type="password"
placeholder="Contraseña"
>

<button class="full blue" onclick="login()">
INICIAR SESIÓN
</button>

<button class="full line" onclick="register()">
REGISTRARSE
</button>

</div>
</div>

<!-- APP -->
<div id="app">

<div class="wrap">

<!-- LEFT -->
<div class="panel">

<div class="title">
Usuarios
</div>

<div class="scroll" id="users"></div>

</div>

<!-- CENTER -->
<div class="center">

<div id="profile">

<div class="big">
<img id="mypfp">
</div>

<h2 id="me"></h2>

<br>

<button class="blue full" onclick="pfp.click()">
Cambiar Foto
</button>

<input
type="file"
id="pfp"
hidden
onchange="uploadPfp()"
>

<br>

<button
class="full"
style="background:#555;color:#fff"
onclick="logout()"
>
LOG OUT
</button>

<br>

<small>
Selecciona una llamada
</small>

</div>

<!-- CALL -->
<div id="call">

<div id="callHead">
Llamada
</div>

<div id="videos"></div>

<div class="controls">

<button class="blue full" onclick="startCall()">
📞 LLAMAR
</button>

<button
class="full"
style="background:#555;color:#fff"
onclick="endCall()"
>
COLGAR
</button>

</div>

</div>

</div>

<!-- RIGHT -->
<div class="panel">

<div class="title">
Crear Grupo
</div>

<input id="room" placeholder="Nombre grupo">

<button class="blue full" onclick="joinGroup()">
Entrar Grupo
</button>

<div class="title" style="margin-top:14px;">
Salas
</div>

<div class="scroll" id="rooms"></div>

</div>

</div>
</div>

<script>
const API="http://saint-mighty-stockings-smilies.trycloudflare.com";
const WS="ws://saint-mighty-stockings-smilies/ws";

let ME=localStorage.getItem("smartcall_user") || "";

let target="";
let ws=null;

let peers={};
let localStream=null;

/* AUTO LOGIN */
if(ME){
showApp();
}

/* REGISTER */
async function register(){

let u=user.value.trim();
let p=pass.value.trim();

if(!u || !p) return;

let r=await fetch(API+"/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:u,
password:p
})
});

if(r.ok){
alert("Cuenta creada");
}else{
alert("Usuario existente");
}
}

/* LOGIN */
async function login(){

let u=user.value.trim();
let p=pass.value.trim();

if(!u || !p) return;

let r=await fetch(API+"/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:u,
password:p
})
});

if(!r.ok){
alert("Credenciales incorrectas");
return;
}

localStorage.setItem("smartcall_user",u);

ME=u;

showApp();
}

/* LOGOUT */
function logout(){

localStorage.removeItem("smartcall_user");

location.reload();
}

/* SHOW APP */
function showApp(){

auth.style.display="none";
app.style.display="block";

me.innerText="@"+ME;

loadMyPfp();

connectSocket();

loadRooms();
}

/* SOCKET */
function connectSocket(){

ws=new WebSocket(`${WS}/${ME}`);

ws.onmessage=async(e)=>{

let data=JSON.parse(e.data);

if(data.type==="users"){
renderUsers(data.users);
}

if(data.type==="room_users"){
renderRoomUsers(data.users);
}

if(data.type==="offer"){
await handleOffer(data);
}

if(data.type==="answer"){

await peers[data.from]
.setRemoteDescription(data.answer);

}

if(data.type==="ice"){

if(peers[data.from]){

await peers[data.from]
.addIceCandidate(data.candidate);

}

}

};

}

/* USERS */
function renderUsers(list){

users.innerHTML="";

list.forEach(u=>{

if(u===ME) return;

users.innerHTML+=`
<div class="user">

<img
src="${API}/media/pfp/${u}.jpg"
onerror="this.src='https://via.placeholder.com/44'"
>

<div class="online"></div>

<div class="name">${u}</div>

<button
class="blue"
onclick="openPrivate('${u}')"
>
Llamar
</button>

</div>
`;

});
}

/* OPEN PRIVATE */
function openPrivate(u){

target=u;

profile.style.display="none";
call.style.display="flex";

callHead.innerText="Llamada con "+u;
}

/* MEDIA */
async function initMedia(){

if(localStream) return;

localStream=
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

let v=document.createElement("video");

v.srcObject=localStream;
v.autoplay=true;
v.muted=true;

videos.appendChild(v);
}

/* PEER */
function createPeer(user){

let pc=new RTCPeerConnection({
iceServers:[
{
urls:"stun:stun.l.google.com:19302"
}
]
});

localStream
.getTracks()
.forEach(t=>pc.addTrack(t,localStream));

pc.ontrack=e=>{

let v=document.createElement("video");

v.srcObject=e.streams[0];
v.autoplay=true;

videos.appendChild(v);
};

pc.onicecandidate=e=>{

if(e.candidate){

ws.send(JSON.stringify({
type:"ice",
to:user,
candidate:e.candidate
}));

}

};

peers[user]=pc;

return pc;
}

/* START CALL */
async function startCall(){

if(!target) return;

await initMedia();

let pc=createPeer(target);

let offer=await pc.createOffer();

await pc.setLocalDescription(offer);

ws.send(JSON.stringify({
type:"offer",
to:target,
offer
}));

}

/* OFFER */
async function handleOffer(data){

target=data.from;

profile.style.display="none";
call.style.display="flex";

callHead.innerText=
"Llamada con "+target;

await initMedia();

let pc=createPeer(data.from);

await pc.setRemoteDescription(data.offer);

let answer=
await pc.createAnswer();

await pc.setLocalDescription(answer);

ws.send(JSON.stringify({
type:"answer",
to:data.from,
answer
}));

}

/* END CALL */
function endCall(){

Object.values(peers)
.forEach(p=>p.close());

peers={};

videos.innerHTML="";

if(localStream){

localStream
.getTracks()
.forEach(t=>t.stop());

localStream=null;

}

call.style.display="none";
profile.style.display="flex";
}

/* JOIN GROUP */
async function joinGroup(){

let r=room.value.trim();

if(!r) return;

target=r;

profile.style.display="none";
call.style.display="flex";

callHead.innerText="Grupo: "+r;

await initMedia();

ws.send(JSON.stringify({
type:"join_room",
room:r
}));

loadRooms();
}

/* ROOM USERS */
async function renderRoomUsers(usersList){

for(let u of usersList){

if(u===ME) continue;

if(peers[u]) continue;

let pc=createPeer(u);

let offer=
await pc.createOffer();

await pc.setLocalDescription(offer);

ws.send(JSON.stringify({
type:"offer",
to:u,
offer
}));

}

}

/* LOAD ROOMS */
async function loadRooms(){

let r=await fetch(API+"/rooms");

let data=await r.json();

rooms.innerHTML="";

Object.keys(data).forEach(room=>{

rooms.innerHTML+=`
<div class="user">

<div class="name">${room}</div>

<button
class="blue"
onclick="quickJoin('${room}')"
>
Entrar
</button>

</div>
`;

});

}

/* QUICK JOIN */
function quickJoin(r){

room.value=r;

joinGroup();
}

/* PFP */
async function uploadPfp(){

let f=pfp.files[0];

if(!f) return;

let fd=new FormData();

fd.append("username",ME);
fd.append("file",f);

await fetch(API+"/upload_pfp",{
method:"POST",
body:fd
});

loadMyPfp();
}

/* LOAD PFP */
function loadMyPfp(){

mypfp.src=
`${API}/media/pfp/${ME}.jpg?${Date.now()}`;
}
</script>

</body>
</html>
